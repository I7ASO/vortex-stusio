<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX STUDIO | IDE</title>

<!-- خط Cairo العربي -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
--bg:#090010;
--card:#12001d;
--purple:#a855f7;
--text:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo', Segoe UI, sans-serif;
}

body{
background: radial-gradient(circle at top,#2b0050 0%,#090010 55%);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.container{
max-width:420px;
margin:auto;
padding:18px;
padding-bottom: 100px;
}

.top{
display:flex;
align-items:center;
justify-content:center;
gap:14px;
margin-top:15px;
margin-bottom:20px;
}

.logo{
width:78px;
height:78px;
border-radius:50%;
object-fit:cover;
border:3px solid var(--purple);
box-shadow:0 0 25px var(--purple);
}

.title h1{
font-size:30px;
line-height:1.1;
font-weight:900;
text-shadow:0 0 20px var(--purple);
}

.title p{
margin-top:6px;
color:#c084fc;
font-size:14px;
}

.card{
background:rgba(18,0,29,.75);
border:1px solid rgba(168,85,247,.25);
backdrop-filter:blur(12px);
border-radius:30px;
padding:18px;
box-shadow:0 0 30px rgba(168,85,247,.15);
}

select{
width:100%;
margin-top:5px;
height:52px;
background:#0d0118;
border:1px solid rgba(168,85,247,.4);
border-radius:18px;
padding:0 15px;
color:white;
font-size:15px;
outline:none;
}

textarea{
width:100%;
height:240px;
margin-top:14px;
background:black;
border:1px solid rgba(168,85,247,.4);
border-radius:22px;
padding:18px;
resize:none;
outline:none;
font-size:15px;
color:#d8b4fe;
direction:ltr;
text-align:left;
font-family: monospace;
}

.quick{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.btn{
height:55px;
border:none;
border-radius:18px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.25s;
color:white;
}

.btn:hover{
transform:scale(.97);
}

.run{
background:linear-gradient(135deg,var(--purple),#6366f1);
box-shadow:0 0 18px rgba(168,85,247,.5);
}

.clear{
background:#2a0a38;
border:1px solid #ff4d6d;
color:#ff6b81;
}

.copy{
background:#1a1f3d;
border:1px solid #4dabf7;
}

.download{
background:#11301e;
border:1px solid #22c55e;
}

.outputTitle{
margin-top:15px;
margin-bottom:8px;
color:#c084fc;
font-weight:700;
}

#output{
background:black;
border-radius:20px;
padding:15px;
min-height:120px;
font-family:monospace;
white-space:pre-wrap;
overflow:auto;
border:1px solid rgba(168,85,247,.3);
color: #22c55e;
font-size: 14px;
}

.bottomNav{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
width:85%;
max-width:350px;
background:rgba(15,0,25,.9);
border:1px solid rgba(168,85,247,.3);
border-radius:28px;
display:flex;
justify-content:center;
gap:10px;
padding:10px;
backdrop-filter:blur(10px);
z-index: 100;
}

.navBtn{
flex:1;
height:54px;
border:none;
border-radius:18px;
background:transparent;
color:white;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.25s;
text-decoration: none;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}

.navBtn.active{
background:linear-gradient(135deg,var(--purple),#6366f1);
box-shadow:0 0 20px rgba(168,85,247,.4);
}
</style>
</head>
<body>

<div class="container">

<div class="top">
<img class="logo" src="https://i.postimg.cc/g2J7gWgr/2306FBBB-8CC1-406C-822B-3FB96AE6E9AF.png" alt="Vortex Logo">
<div class="title">
<h1>VORTEX<br>STUDIO</h1>
<p>Advanced Mobile IDE</p>
</div>
</div>

<div class="card">
<select id="lang">
<option value="none">اختر لغة البرمجة</option>
<option value="html">HTML</option>
<option value="javascript">JavaScript</option>
</select>

<textarea id="editor" placeholder="اكتب السكربت هنا..."></textarea>

<div class="quick">
<button class="btn run" onclick="runCode()"><i class="fa-solid fa-play"></i> تشغيل</button>
<button class="btn clear" onclick="clearCode()"><i class="fa-solid fa-trash"></i> حذف</button>
<button class="btn copy" onclick="copyCode()"><i class="fa-solid fa-copy"></i> نسخ</button>
<button class="btn download" onclick="downloadCode()"><i class="fa-solid fa-download"></i> تنزيل</button>
</div>

<div class="outputTitle">النتيجة</div>
<div id="output">جاهز للتشغيل...</div>
</div>

</div>

<div class="bottomNav">
<a href="index.html" class="navBtn"><i class="fa-solid fa-house"></i> الرئيسية</a>
<a href="ide.html" class="navBtn active"><i class="fa-solid fa-code"></i> IDE</a>
</div>

<script>
function runCode(){
const lang = document.getElementById("lang").value;
const code = document.getElementById("editor").value;
const output = document.getElementById("output");

output.innerHTML = "";
output.style.color = "#22c55e";

if(lang === "javascript"){
try{
const oldLog = console.log;
console.log = function(msg){
output.innerHTML += msg + "<br>";
};
eval(code);
console.log = oldLog;
}catch(err){
output.innerHTML = "ERROR : " + err.message;
output.style.color = "#ff6b81";
}
}
else if(lang === "html"){
localStorage.setItem("vortex_html", code);
window.location.href = "preview.html";
}
else{
output.innerHTML = "الرجاء اختيار لغة البرمجة أولاً!";
output.style.color = "#ff6b81";
}
}

function clearCode(){
document.getElementById("editor").value = "";
document.getElementById("output").innerHTML = "تم حذف السكربت بنجاح";
}

function copyCode(){
const text = document.getElementById("editor");
if(!text.value) {
document.getElementById("output").innerHTML = "لا يوجد كود للنسخ!";
return;
}
navigator.clipboard.writeText(text.value);
document.getElementById("output").innerHTML = "تم نسخ السكربت بنجاح";
}

function downloadCode(){
const code = document.getElementById("editor").value;
if(!code) {
document.getElementById("output").innerHTML = "لا يوجد كود للتحميل!";
return;
}
const blob = new Blob([code], {type:"text/plain"});
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "vortex-script.txt";
a.click();
document.getElementById("output").innerHTML = "بدأ تنزيل الملف...";
}
</script>

</body>
</html>
